name: Publicar página (GitHub Pages)

# La página se publica en Netlify. Este workflow es opcional y se ejecuta a mano (pestaña Actions → «Run workflow»)
# después de activar Pages en Settings → Pages → Source: GitHub Actions. Así no falla en cada push mientras
# Pages esté desactivado.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ConstruTrack/src/construtrack/vista/web
      - id: deployment
        uses: actions/deploy-pages@v4
