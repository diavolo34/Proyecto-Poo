name: CI

on:
  push:
  pull_request:

jobs:
  java:
    name: Compilar y probar ConstruTrack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar (warnings como errores)
        run: |
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -d out $(find ConstruTrack/src -name "*.java")
          (cd ConstruTrack/src && find . -type f ! -name "*.java" -exec cp --parents {} ../../out/ \;)

      - name: Pruebas unitarias (JUnit 5)
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -cp out:junit.jar -d out-test $(find ConstruTrack/test -name "*.java")
          java -jar junit.jar execute -cp out:out-test --scan-class-path --disable-banner --details=tree --fail-if-no-tests

      - name: Prueba de humo de la API
        run: |
          java -cp out construtrack.App --sin-ventana &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/api/estado && break; sleep 0.5; done
          echo
          curl -sf http://localhost:8080/ -o /dev/null
          token=$(curl -sf -X POST http://localhost:8080/api/login \
            -H 'Content-Type: application/json' \
            -d '{"cedula":"10000001","clave":"jefe123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          curl -sf http://localhost:8080/api/usuarios -H "Authorization: Bearer $token" -o /dev/null
          # Un empleado no puede listar al personal
          token=$(curl -sf -X POST http://localhost:8080/api/login \
            -d '{"cedula":"30000001","clave":"emp123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/usuarios -H "Authorization: Bearer $token")" = 403
          echo "API OK"
