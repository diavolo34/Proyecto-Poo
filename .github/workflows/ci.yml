name: CI

on:
  push:
  pull_request:

jobs:
  java:
    name: Compilar y probar ConstruTrack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar (warnings como errores)
        run: |
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -d out $(find ConstruTrack/src -name "*.java")
          (cd ConstruTrack/src && find . -type f ! -name "*.java" -exec cp --parents {} ../../out/ \;)

      - name: Pruebas unitarias (JUnit 5)
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -cp out:junit.jar -d out-test $(find ConstruTrack/test -name "*.java")
          java -jar junit.jar execute -cp out:out-test --scan-class-path --disable-banner --details=tree --fail-if-no-tests

      - name: Prueba de humo de la API
        run: |
          java -cp out construtrack.App --sin-ventana --demo &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/api/estado && break; sleep 0.5; done
          echo
          curl -sf http://localhost:8080/ -o /dev/null
          token=$(curl -sf -X POST http://localhost:8080/api/login \
            -H 'Content-Type: application/json' \
            -d '{"cedula":"10000001","clave":"gerente123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          curl -sf http://localhost:8080/api/usuarios -H "Authorization: Bearer $token" -o /dev/null
          curl -sf http://localhost:8080/api/obras/PR-01/codigo-asistencia -H "Authorization: Bearer $token" | grep -q '"codigo":"[0-9]\{6\}"'
          curl -sf http://localhost:8080/api/asistencia/por-confirmar -H "Authorization: Bearer $token" | grep -q 'Pedro'
          curl -sf "http://localhost:8080/api/novedades?categoria=LICENCIA" -H "Authorization: Bearer $token" | grep -q 'Reposo médico'
          curl -sf "http://localhost:8080/api/novedades?categoria=REPORTE_OBRA" -H "Authorization: Bearer $token" | grep -q 'Retardo'
          curl -sf http://localhost:8080/api/inventario -H "Authorization: Bearer $token" | grep -q 'HE-001'
          curl -sf http://localhost:8080/api/catalogo -H "Authorization: Bearer $token" | grep -q 'Jefe de proyecto'
          curl -sf http://localhost:8080/api/talento -H "Authorization: Bearer $token" | grep -q 'activos'
          curl -sf http://localhost:8080/api/obras -H "Authorization: Bearer $token" | grep -q '"estado":"PLANIFICADA"'
          curl -sf http://localhost:8080/api/areas -H "Authorization: Bearer $token" | grep -q '"nombre":"Plomería"'
          curl -sf "http://localhost:8080/api/asistencia/ubicaciones" -H "Authorization: Bearer $token" -o /dev/null
          curl -s -D - -o /dev/null http://localhost:8080/app.html | grep -qi "frame-src https://www.openstreetmap.org"
          # Un empleado no puede listar al personal
          token=$(curl -sf -X POST http://localhost:8080/api/login \
            -d '{"cedula":"30000001","clave":"emp123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/usuarios -H "Authorization: Bearer $token")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/areas -H "Authorization: Bearer $token")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/asistencia/entrada -H "Authorization: Bearer $token" -d '{"codigo":"000000"}')" = 400
          # El empleado no accede a los reportes de proyecto ni sube documentos
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/api/novedades?categoria=REPORTE_OBRA" -H "Authorization: Bearer $token")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/archivos -H "Authorization: Bearer $token" -d '{"nombre":"a.pdf","datos":"JVBERi0xLjQK"}')" = 403
          echo "API OK (modo demostración)"
          # Modo producción: arranca vacío y la demo privada solo entra con la clave
          DEMO_CLAVE=clave-ci PORT=8081 DATOS=/tmp/produccion.txt java -cp out construtrack.App --sin-ventana &
          for i in $(seq 1 20); do curl -sf http://localhost:8081/api/estado && break; sleep 0.5; done
          echo
          test "$(curl -sf http://localhost:8081/api/publico | python3 -c 'import sys,json; print(json.load(sys.stdin)["empresas"])')" = 0
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/login -d '{"cedula":"10000001","clave":"gerente123"}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/demo/api/demo/acceso -d '{"clave":"mala","rol":"Gerente"}')" = 401
          token=$(curl -sf -X POST http://localhost:8081/demo/api/demo/acceso \
            -d '{"clave":"clave-ci","rol":"Gerente"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          curl -sf http://localhost:8081/demo/api/usuarios -H "Authorization: Bearer $token" -o /dev/null
          curl -s -D - -o /dev/null http://localhost:8081/api/estado | grep -qi "x-content-type-options: nosniff"
          curl -s -D - -o /dev/null http://localhost:8081/app.html | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/clave/olvido -d '{"correo":"nadie@correo.com"}')" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/clave/restablecer -d '{"token":"x","clave":"Nueva2026","confirmacion":"Nueva2026"}')" = 409
          for i in 1 2 3 4 5; do curl -s -o /dev/null -X POST http://localhost:8081/api/login -d '{"identificador":"bloqueo@correo.com","clave":"x"}'; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/login -d '{"identificador":"bloqueo@correo.com","clave":"x"}')" = 429
          echo "API OK (modo producción, demo privada, cabeceras, recuperación de clave y bloqueo por intentos)"
