<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif">
  <!-- ConstruTrack · Ilustración: horas de la semana con horas extra, campana de alertas y aviso de retardos -->
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#091e42" flood-opacity=".16"/>
    </filter>
  </defs>
  <circle cx="250" cy="220" r="190" fill="#fff" opacity=".45"/>
  <path d="M470 222l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#0c66e4"/>
  <circle cx="30" cy="96" r="7" fill="#0c66e4"/>

  <!-- Tarjeta con el gráfico -->
  <g filter="url(#sombra)">
    <rect x="30" y="58" width="370" height="306" rx="20" fill="#fff"/>
  </g>
  <text x="56" y="98" font-size="16" font-weight="700" fill="#172b4d">Horas de la semana</text>
  <text x="56" y="118" font-size="12.5" fill="#44546f">Jornada de 8 h</text>
  <rect x="248" y="88" width="10" height="10" rx="2" fill="#0c66e4"/>
  <text x="264" y="97" font-size="12" fill="#44546f">Jornada</text>
  <rect x="320" y="88" width="10" height="10" rx="2" fill="#fca700"/>
  <text x="336" y="97" font-size="12" fill="#44546f">Extra</text>

  <!-- Barras: 18 px por hora, base en y=330 -->
  <g>
    <rect x="62" y="186" width="34" height="144" rx="6" fill="#0c66e4"/>
    <rect x="116" y="195" width="34" height="135" rx="6" fill="#0c66e4"/>
    <rect x="170" y="186" width="34" height="144" rx="6" fill="#0c66e4"/>
    <rect x="224" y="168" width="34" height="26" rx="6" fill="#fca700"/>
    <rect x="224" y="186" width="34" height="144" rx="6" fill="#0c66e4"/>
    <rect x="278" y="141" width="34" height="53" rx="6" fill="#fca700"/>
    <rect x="278" y="186" width="34" height="144" rx="6" fill="#0c66e4"/>
    <rect x="332" y="249" width="34" height="81" rx="6" fill="#fca700"/>
  </g>
  <path d="M50 186 H380" stroke="#44546f" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="372" y="178" text-anchor="end" font-size="12" font-weight="600" fill="#44546f">8 h</text>
  <g font-size="13" font-weight="600" fill="#44546f" text-anchor="middle">
    <text x="79" y="352">L</text><text x="133" y="352">M</text><text x="187" y="352">X</text>
    <text x="241" y="352">J</text><text x="295" y="352">V</text><text x="349" y="352">S</text>
  </g>

  <!-- Campana de alertas -->
  <circle cx="424" cy="84" r="52" fill="#ffeceb"/>
  <rect x="419" y="44" width="10" height="12" rx="5" fill="#e34935"/>
  <path d="M424 52c-17 0-28 13-28 30v18l-9 11h74l-9-11V82c0-17-11-30-28-30z" fill="#e34935"/>
  <circle cx="424" cy="118" r="8" fill="#e34935"/>
  <circle cx="456" cy="54" r="17" fill="#ae2e24" stroke="#fff" stroke-width="4"/>
  <text x="456" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>

  <!-- Avisos -->
  <g filter="url(#sombra)">
    <rect x="250" y="352" width="244" height="56" rx="14" fill="#fff"/>
  </g>
  <rect x="264" y="368" width="54" height="24" rx="6" fill="#fff7d6"/>
  <text x="291" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#7f5f01">Media</text>
  <text x="330" y="378" font-size="13.5" font-weight="700" fill="#172b4d">3 llegadas tarde</text>
  <text x="330" y="396" font-size="12" fill="#44546f">la más antigua, primero</text>
  <g filter="url(#sombra)">
    <rect x="212" y="420" width="282" height="46" rx="14" fill="#fff"/>
  </g>
  <circle cx="238" cy="443" r="12" fill="#22a06b"/>
  <path d="M232 443l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="258" y="448" font-size="13.5" font-weight="700" fill="#216e4e">+2,5 h extra aprobadas</text>
</svg>
