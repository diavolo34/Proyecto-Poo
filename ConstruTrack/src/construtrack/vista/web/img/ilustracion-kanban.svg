<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <!-- ConstruTrack · Ilustración: tablero de incidencias con una tarjeta que pasa a la siguiente columna -->
  <defs>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#091e42" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="276" height="206" rx="20" fill="#fff"/>
  <g fill="#f1f2f4">
    <rect x="18" y="20" width="76" height="170" rx="10"/>
    <rect x="102" y="20" width="76" height="170" rx="10"/>
    <rect x="186" y="20" width="76" height="170" rx="10"/>
  </g>
  <g fill="#8590a2">
    <rect x="28" y="32" width="38" height="7" rx="3.5"/><rect x="112" y="32" width="44" height="7" rx="3.5"/><rect x="196" y="32" width="34" height="7" rx="3.5"/>
  </g>
  <!-- Pendiente -->
  <rect x="26" y="50" width="60" height="40" rx="6" fill="#fff" stroke="#dcdfe4"/>
  <rect x="26" y="50" width="5" height="40" rx="2" fill="#b38600"/>
  <rect x="37" y="60" width="38" height="6" rx="3" fill="#172b4d"/><rect x="37" y="72" width="28" height="5" rx="2.5" fill="#c1c7d0"/>
  <!-- En revisión: hueco donde cae la tarjeta -->
  <rect x="110" y="50" width="60" height="40" rx="6" fill="#fff" stroke="#dcdfe4"/>
  <rect x="110" y="50" width="5" height="40" rx="2" fill="#0c66e4"/>
  <rect x="121" y="60" width="38" height="6" rx="3" fill="#172b4d"/><rect x="121" y="72" width="22" height="5" rx="2.5" fill="#c1c7d0"/>
  <rect x="110" y="98" width="60" height="40" rx="6" fill="none" stroke="#0c66e4" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Aprobada -->
  <rect x="194" y="50" width="60" height="40" rx="6" fill="#fff" stroke="#dcdfe4"/>
  <rect x="194" y="50" width="5" height="40" rx="2" fill="#22a06b"/>
  <rect x="205" y="60" width="38" height="6" rx="3" fill="#172b4d"/><rect x="205" y="72" width="30" height="5" rx="2.5" fill="#c1c7d0"/>
  <rect x="194" y="98" width="60" height="40" rx="6" fill="#fff" stroke="#dcdfe4"/>
  <rect x="194" y="98" width="5" height="40" rx="2" fill="#ae2e24"/>
  <rect x="205" y="108" width="34" height="6" rx="3" fill="#172b4d"/><rect x="205" y="120" width="24" height="5" rx="2.5" fill="#c1c7d0"/>
  <!-- Flecha y tarjeta en movimiento -->
  <path d="M58 168 C66 186 96 184 108 152" fill="none" stroke="#0c66e4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 6"/>
  <g transform="rotate(-8 92 128)" filter="url(#sombra)">
    <rect x="62" y="108" width="62" height="42" rx="6" fill="#fff"/>
    <rect x="62" y="108" width="5" height="42" rx="2" fill="#fca700"/>
    <rect x="73" y="118" width="40" height="6" rx="3" fill="#172b4d"/><rect x="73" y="130" width="26" height="5" rx="2.5" fill="#c1c7d0"/>
  </g>
  <path d="M116 140 l0 22 6-6 5 10 4-2-5-10 8 0 z" fill="#172b4d" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
