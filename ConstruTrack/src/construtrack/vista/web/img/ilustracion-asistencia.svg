  </g>
  <text x="98" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#7f5f01">+10 min de tolerancia</text>

  <!-- Estado: en la obra -->
  <g filter="url(#sombra)">
    <rect x="330" y="118" width="140" height="38" rx="19" fill="#fff"/>
  </g>
  <circle cx="352" cy="137" r="6" fill="#22a06b"/>
  <text x="366" y="142" font-size="14" font-weight="700" fill="#216e4e">En la obra</text>

  <!-- Casco -->
  <g transform="translate(352 300)">
    <path d="M12 56a58 50 0 0 1 116 0z" fill="#fca700"/>
    <rect x="0" y="52" width="140" height="14" rx="7" fill="#e08e00"/>
    <rect x="62" y="10" width="16" height="44" rx="8" fill="#ffc94d"/>
