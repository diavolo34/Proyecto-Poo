# Blueprint de Render: publica el servidor Java (API + páginas) desde este repositorio.
# En Render: New + → Blueprint → elige este repositorio → Apply.
services:
  - type: web
    name: construtrack-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/estado
    envVars:
      # Sitios que pueden usar la API desde el navegador (separados por coma)
      # Hora de la obra: el servidor usa UTC; sin esto las entradas quedan 4 h adelantadas y salen como retardos
      - key: ZONA
        value: America/Caracas
      - key: CORS_ORIGEN
        value: https://startling-toffee-914e34.netlify.app,https://diavolo34.github.io
      # Datos permanentes: el plan gratuito borra el disco al reiniciar, así que se guardan en Upstash Redis.
      # Copia los valores desde console.upstash.com (pestaña REST API) en Render → Environment.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Invitaciones por correo con Brevo (gratis, 300 al día). Sin estas variables solo se registran en la consola.
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: URL_SITIO
        value: https://startling-toffee-914e34.netlify.app
